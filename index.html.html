.quiz-option { padding: 14px 18px; border: 2px solid #e0e3f0; border-radius: 12px;
  cursor: pointer; background: #fff; font-size: 15px; text-align: left; font-family: inherit; }
.quiz-option.correct { background: #dcfce7; border-color: #22c55e; color: #15803d; font-weight: 700; }
.quiz-option.wrong { background: #fee2e2; border-color: #ef4444; color: #b91c1c; font-weight: 700; }
.quiz-option.disabled { cursor: default; }
.quiz-result { text-align: center; padding: 20px; }
.quiz-result .score { font-size: 56px; font-weight: 800; color: #667eea; }
.quiz-result .msg { font-size: 18px; margin: 12px 0; font-weight: 600; }
.quiz-count-btn, .quiz-mode-btn { padding: 10px 16px; border-radius: 10px;
  border: 2px solid #e0e3f0; background: #fff; cursor: pointer;
  font-size: 14px; font-weight: 600; color: #667eea; font-family: inherit; }
.quiz-mode-btn.active { background: #667eea; color: #fff; border-color: #667eea; }
.quiz-summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
  gap: 8px; max-height: 340px; overflow-y: auto; padding: 4px; }
.quiz-summary-card { border-radius: 10px; padding: 8px 6px 6px;
  text-align: center; border: 1.5px solid #e0e3f0; background: #fff; }
.quiz-summary-card.status-learned { background: #d1fae5; border-color: #10b981; }
.quiz-summary-card.status-review { background: #fef3c7; border-color: #eab308; }
.quiz-summary-card.status-hard { background: #fecaca; border-color: #dc2626; }
.quiz-summary-card .qsh { font-size: 18px; font-weight: 700; font-family: 'Microsoft YaHei',sans-serif; }
.quiz-summary-card .qsp { font-size: 10px; color: #888; margin-top: 2px; }
.quiz-summary-card .qsm { font-size: 10px; color: #666; margin-top: 3px; line-height: 1.3; min-height: 24px; }
.quiz-summary-card .qss-actions { display: flex; gap: 3px; justify-content: center; margin-top: 6px; }
.qss-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #ddd;
  cursor: pointer; font-size: 11px; font-weight: 700; background: #fff; color: #999; }
.qss-btn.learned.active { background: #10b981; color: #fff; border-color: #10b981; }
.qss-btn.review.active { background: #eab308; color: #fff; border-color: #eab308; }
.qss-btn.hard.active { background: #dc2626; color: #fff; border-color: #dc2626; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #333; color: #fff; padding: 12px 22px; border-radius: 10px;
  font-size: 14px; font-weight: 600; opacity: 0; transition: .3s; z-index: 200; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { background: #22c55e; }
.toast.error { background: #ef4444; }
.empty { background: #fff; border-radius: 14px; padding: 40px 20px; text-align: center;
  color: #999; font-size: 14px; }
.empty .big { font-size: 40px; margin-bottom: 10px; }
.pending-banner { background: linear-gradient(135deg, #fef3c7, #fde68a);
  border-radius: 14px; padding: 30px; text-align: center;
  max-width: 500px; margin: 40px auto; box-shadow: 0 8px 20px rgba(0,0,0,.1); }
.pending-banner h2 { color: #92400e; margin-bottom: 12px; }
.pending-banner p { color: #78350f; font-size: 14px; line-height: 1.6; }
</style>

function esc(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s) { return esc(s); }
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.className = 'toast'; }, 2200);
}

function parseSubItems(str) {
  if (!str) return [];
  return str.split(/\s*[;,]\s*/).filter(s => s).map(item => {
    const p = item.split('/').map(s => s.trim());
    return { h: p[0] || '', p: p[1] || '', m: p[2] || '' };
  }).filter(x => x.h);
}
function parseLines(str) {
  if (!str) return [];
  return str.split('\n').map(l => l.trim()).filter(l => l).map(line => {
    const parts = line.split('|').map(s => s.trim());
    return { h: parts[0] || '', p: parts[1] || '', m: parts[2] || '' };
  }).filter(x => x.h);
}
function serializeItems(arr) {
  if (!arr || !arr.length) return '';
  return arr.map(e => [e.h, e.p, e.m].filter(x => x).join('|')).join('\n');
}
function loadBundles(callback) {
  dbRef('bundles').once('value').then(snapshot => {
    const raw = snapshot.val() || {};
    bundles = {};
    Object.keys(raw).forEach(bid => {
      const b = raw[bid];
      const wordsArr = [];
      if (b.words) {
        Object.keys(b.words).forEach(wid => {
          wordsArr.push({ _id: wid, ...b.words[wid] });
        });
      }
        bundles[bid] = {
        _id: bid, name: b.name || 'Không tên', desc: b.desc || '',
        isPublic: !!b.isPublic, createdAt: b.createdAt || 0,
        ownerId: b.ownerId || null,
        words: wordsArr
      };
    });
    if (callback) callback();
  }).catch(err => { console.error('Lỗi tải bundles:', err); if (callback) callback(); });
}
function loadMyProgress(callback) {
  if (!currentUser) { if (callback) callback(); return; }
  dbRef('users/' + currentUser.uid + '/progress').once('value').then(snapshot => {
    const p = snapshot.val() || {};
    myStatuses = p.statuses || {};
    myNotes = p.notes || {};
    myQuizzed = p.quizzed || {};
    return dbRef('users/' + currentUser.uid + '/studyLog').once('value');
  }).then(logSnap => {
    myStudyLog = (logSnap && logSnap.val()) || {};
    if (callback) callback();
  }).catch(err => { console.error('Lỗi tải progress:', err); if (callback) callback(); });
}

function initSampleBundles() {
  let created = 0, checked = 0;
  const total = SAMPLE_BUNDLES.length;
  SAMPLE_BUNDLES.forEach(bundle => {
    dbRef('bundles/' + bundle.id).once('value').then(snapshot => {
      checked++;
      if (snapshot.exists()) { if (checked === total) finishInit(); return; }
      const wordsObj = {};
      bundle.words.forEach(w => { wordsObj[genId()] = w; });
      dbRef('bundles/' + bundle.id).set({
        name: bundle.name, desc: bundle.desc, isPublic: bundle.isPublic,
        createdAt: Date.now(), words: wordsObj
      }).then(() => {
        created++; checked++;
        if (checked === total) finishInit();
      }).catch(err => {
        console.error('Lỗi tạo ' + bundle.id, err);
        checked++;
        if (checked === total) finishInit();
      });
    });
  });
  function finishInit() {
    if (created > 0) toast('Đã tạo ' + created + ' bộ HSK mẫu!', 'success');
    else toast('Đã có sẵn 6 bộ HSK mẫu!', 'info');
    loadBundles(() => renderDashboard());
  }
}
/* ============ AUTH ============ */
function switchLoginTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  setLoginMessage('', '');
}
function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { setLoginMessage('Vui lòng nhập đầy đủ!', 'error'); return; }
  setLoginMessage('Đang đăng nhập...', 'info');
  auth.signInWithEmailAndPassword(email, password)
    .then(() => setLoginMessage('Đăng nhập thành công!', 'success'))
    .catch(error => {
      let msg = 'Lỗi: ' + error.message;
      if (error.code === 'auth/user-not-found') msg = 'Email này chưa được đăng ký!';
      else if (error.code === 'auth/wrong-password') msg = 'Mật khẩu không đúng!';
      else if (error.code === 'auth/invalid-email') msg = 'Email không hợp lệ!';
      else if (error.code === 'auth/invalid-credential') msg = 'Email hoặc mật khẩu không đúng!';
      else if (error.code === 'auth/too-many-requests') msg = 'Quá nhiều lần thử. Đợi vài phút!';
      setLoginMessage(msg, 'error');
    });
}
function handleRegister() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) { setLoginMessage('Vui lòng nhập đầy đủ!', 'error'); return; }
  if (password.length < 6) { setLoginMessage('Mật khẩu phải ≥ 6 ký tự!', 'error'); return; }
  setLoginMessage('Đang tạo tài khoản...', 'info');
  auth.createUserWithEmailAndPassword(email, password)
    .then(cred => {
      const uid = cred.user.uid;
      const emailLower = email.toLowerCase();
      const isAdminEmail = (emailLower === ADMIN_EMAIL.toLowerCase());
      const userData = {
        email: emailLower, displayName: name,
        status: isAdminEmail ? 'approved' : 'pending',
        createdAt: Date.now()
      };
      return dbRef('users/' + uid).set(userData).then(() => {
        if (isAdminEmail) return dbRef('admins/' + uid).set(true);
        return dbRef('pendingUsers/' + uid).set({
          email: emailLower, displayName: name, requestedAt: Date.now()
        });
      });
    })
    .then(() => setLoginMessage('Đăng ký thành công! Vui lòng đợi admin duyệt.', 'success'))
    .catch(error => {
      let msg = 'Lỗi: ' + error.message;
      if (error.code === 'auth/email-already-in-use') msg = 'Email này đã được đăng ký!';
      else if (error.code === 'auth/invalid-email') msg = 'Email không hợp lệ!';
      else if (error.code === 'auth/weak-password') msg = 'Mật khẩu quá yếu!';
      setLoginMessage(msg, 'error');
    });
}
function handleLogout() {
  if (!confirm('Bạn có chắc muốn đăng xuất?')) return;
  auth.signOut().then(() => {
    currentUser = null; currentUserData = null; isAdmin = false;
    myStatuses = {}; myNotes = {}; myQuizzed = {}; bundles = {};
    adminInStudentMode = false;
    document.getElementById('btnSwitchView').style.display = 'none';
    document.getElementById('loginPassword').value = '';
    document.getElementById('regPassword').value = '';
    setLoginMessage('Đã đăng xuất.', 'info');
  });
}

function doChangePassword() {
  const cur = document.getElementById('cp-current').value;
  const nw = document.getElementById('cp-new').value;
  const cf = document.getElementById('cp-confirm').value;
  if (!cur || !nw || !cf) { toast('Nhập đầy đủ!', 'error'); return; }
  if (nw.length < 6) { toast('Mật khẩu mới ≥ 6 ký tự!', 'error'); return; }
  if (nw !== cf) { toast('Xác nhận không khớp!', 'error'); return; }
  const user = auth.currentUser;
  if (!user) return;
  const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
  user.reauthenticateWithCredential(cred)
    .then(() => user.updatePassword(nw))
    .then(() => { toast('Đổi mật khẩu thành công!', 'success'); closeForm(); })
    .catch(err => {
      let msg = err.message;
      if (err.code === 'auth/wrong-password') msg = 'Mật khẩu hiện tại không đúng!';
      toast(msg, 'error');
    });
}
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display = 'block';
    // Ẩn ngay, sẽ set tên sau khi load userData
    document.getElementById('userEmail') && (document.getElementById('userEmail').textContent = user.email);
    checkIsAdmin(user.uid, admin => {
      isAdmin = admin;
      dbRef('users/' + user.uid).once('value').then(snapshot => {
               currentUserData = snapshot.val() || {};
        const status = currentUserData.status || 'pending';
        const badge = document.getElementById('userRoleBadge');
        badge.innerHTML = admin ? '<span class="badge-admin">👑 ADMIN</span>' : '';

        // Hiện tên học sinh ở top-bar
        const displayName = currentUserData.displayName || (user.email || '').split('@')[0];
        const dName = document.getElementById('userDisplayName');
        const dName2 = document.getElementById('udName');
        const dEmail = document.getElementById('udEmail');
        if (dName) dName.textContent = displayName;
        if (dName2) dName2.textContent = displayName;
        if (dEmail) dEmail.textContent = user.email;
        const av = document.getElementById('userAvatar');
        if (av) av.textContent = (displayName.trim()[0] || '?').toUpperCase();
        if (status === 'pending' && !admin) {
          document.getElementById('pendingView').style.display = 'block';
          document.getElementById('studentView').style.display = 'none';
          document.getElementById('adminView').style.display = 'none';
          document.getElementById('btnSwitchView').style.display = 'none';
          setLoginMessage('', '');
          return;
        }
        document.getElementById('pendingView').style.display = 'none';
               if (admin) {
          document.getElementById('btnSwitchView').style.display = 'block';
          adminInStudentMode = false;
          applyAdminView();
        } else {
          document.getElementById('btnSwitchView').style.display = 'none';
          document.getElementById('adminView').style.display = 'none';
          document.getElementById('studentView').style.display = 'block';
          document.getElementById('bundleView').style.display = 'block';
          document.getElementById('studyView').style.display = 'none';
          loadBundles(() => loadMyProgress(() => renderBundlesForStudent()));
        }
        setLoginMessage('', '');
      });
    });
  } else {
    currentUser = null; currentUserData = null; isAdmin = false;
    adminInStudentMode = false;
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('mainView').style.display = 'none';
       document.getElementById('userDisplayName').textContent = '...';
    document.getElementById('userRoleBadge').innerHTML = '';
    document.getElementById('userDropdown').classList.remove('active');
    document.getElementById('userMenuWrap') && document.getElementById('userMenuWrap').classList.remove('open');
    const dd = document.getElementById('userDropdown');
    if (dd) dd.parentElement.classList.remove('open');
    const btnS = document.getElementById('btnSwitchView');
    if (btnS) btnS.style.display = 'none';
    switchLoginTab('login');
  }
});
function toggleAdminStudentView() {
  if (!isAdmin) return;
  adminInStudentMode = !adminInStudentMode;
  applyAdminView();
}
function applyAdminView() {
  if (!isAdmin) return;
  const adminView = document.getElementById('adminView');
  const studentView = document.getElementById('studentView');
   const btn = document.getElementById('btnSwitchView');
  btn.style.display = 'block';
  if (adminInStudentMode) {
    adminView.style.display = 'none';
    studentView.style.display = 'block';
    document.getElementById('bundleView').style.display = 'block';
    document.getElementById('studyView').style.display = 'none';
    btn.textContent = '👑 Về Dashboard';
    loadBundles(() => loadMyProgress(() => renderBundlesForStudent()));
  } else {
    adminView.style.display = 'block';
    studentView.style.display = 'none';
    btn.textContent = '🎓 Vào học';
       loadBundles(() => { renderDashboard(); renderPendingBadge(); renderFeedbackBadge(); });
  }
}

});

function saveEditProfile() {
  const newName = document.getElementById('ep-name').value.trim();
  const curPwd = document.getElementById('ep-cur').value;
  const newPwd = document.getElementById('ep-new').value;
  const cfPwd = document.getElementById('ep-cf').value;
  if (!newName) { toast('Tên không được trống!', 'error'); return; }

  const doUpdateName = () => dbRef('users/' + currentUser.uid + '/displayName').set(newName)
    .then(() => {
      currentUserData.displayName = newName;
      document.getElementById('userDisplayName').textContent = newName;
      document.getElementById('udName').textContent = newName;
      const av = document.getElementById('userAvatar');
      if (av) av.textContent = (newName.trim()[0] || '?').toUpperCase();
    });

  const wantsPwdChange = curPwd || newPwd || cfPwd;
  if (!wantsPwdChange) {
    doUpdateName().then(() => { toast('Đã lưu thông tin!', 'success'); closeForm(); })
      .catch(err => toast('Lỗi: ' + err.message, 'error'));
    return;
  }

  if (!curPwd || !newPwd || !cfPwd) { toast('Nhập đủ 3 ô mật khẩu!', 'error'); return; }
  if (newPwd.length < 6) { toast('Mật khẩu mới ≥ 6 ký tự!', 'error'); return; }
  if (newPwd !== cfPwd) { toast('Xác nhận không khớp!', 'error'); return; }

  const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, curPwd);
  currentUser.reauthenticateWithCredential(cred)
    .then(() => currentUser.updatePassword(newPwd))
    .then(() => doUpdateName())
    .then(() => { toast('Đã cập nhật!', 'success'); closeForm(); })
    .catch(err => {
      let msg = err.message;
      if (err.code === 'auth/wrong-password') msg = 'Mật khẩu hiện tại không đúng!';
      toast(msg, 'error');
    });
}

function renderStudyCalendar() {
  const now = new Date();
  const year = now.getFullYear();

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = now.getDate();
  const totalLearned = Object.values(myStatuses).filter(s => s === 'learned').length;

  let html = '<div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:20px;box-shadow:0 4px 12px rgba(0,0,0,.1);">';

  html += '<div style="background:linear-gradient(135deg,#d1fae5,#a7f3d0);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;color:#065f46;">✅ Đã học: ' + totalLearned + ' từ</div>';
  html += '</div>';

  ['CN','T2','T3','T4','T5','T6','T7'].forEach(d => html += '<div>' + d + '</div>');
  html += '</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">';
  for (let i = 0; i < firstDay; i++) html += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const log = myStudyLog[dateStr];
    const count = log ? (log.learned || 0) : 0;
    const isToday = d === today;
    let bg = '#fff', color = '#666', border = '1.5px solid #e0e3f0';
    if (count > 0) { bg = '#d1fae5'; color = '#065f46'; border = '1.5px solid #10b981'; }
    if (isToday) border = '2px solid #7c3aed';
    html += '<div style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:' + bg + ';border:' + border + ';border-radius:10px;font-size:13px;font-weight:600;color:' + color + ';padding:4px;" title="' + dateStr + ': ' + count + ' từ">' +
      '<div>' + d + '</div>' +
      (count > 0 ? '<div style="font-size:9px;font-weight:700;">' + count + '</div>' : '') +
      '</div>';
  }
  html += '</div></div>';
  return html;

function renderWords() {
  const grid = document.getElementById('wordGrid');
  grid.innerHTML = '';
  if (!currentBundleId || !bundles[currentBundleId]) return;
  const allWords = bundles[currentBundleId].words;
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  let words = allWords.slice();
  if (statusFilter !== 'all') words = words.filter(w => (myStatuses[w.h] || 'new') === statusFilter);
  if (q) words = words.filter(w =>
    (w.h || '').toLowerCase().includes(q) ||
    (w.p || '').toLowerCase().includes(q) ||
    (w.m || '').toLowerCase().includes(q)
  );
  if (words.length === 0) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1;"><div class="big">🔍</div>Không có từ nào.</div>';
    return;
  }
  words.forEach(w => {
    const status = myStatuses[w.h] || 'new';
    const card = document.createElement('div');
    card.className = 'word-card status-' + status;
    card.innerHTML =
      '<div class="hanzi">' + esc(w.h) + '</div>' +
      '<div class="status-strip"></div>' +
      '<button class="status-btn" onclick="event.stopPropagation();cycleStatus(\'' +
        escAttr(w.h) + '\')">' + statusIcon(status) + '</button>';
    card.onclick = () => showWordDetail(w);
    grid.appendChild(card);
  });
}
function statusIcon(s) { return { new: '○', learned: '✓', review: '↻', hard: '!' }[s] || '○'; }
function cycleStatus(hanzi) {
  const order = ['new', 'learned', 'review', 'hard'];
  const cur = myStatuses[hanzi] || 'new';
  const next = order[(order.indexOf(cur) + 1) % order.length];
  if (next === 'new') delete myStatuses[hanzi];
  else myStatuses[hanzi] = next;
  saveMyProgress();
  renderWords();
  const labels = { new:'⚪ Chưa học', learned:'🟢 Đã học', review:'🟡 Cần ôn', hard:'🔴 Từ khó' };
  toast(hanzi + ' → ' + labels[next], 'success');
}
function setStatusFilter(status, btn) {
  statusFilter = status;
  document.querySelectorAll('.status-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderWords();
}

    pos: item.pos || null,
    ex: item.ex || [], syn: item.syn || [], ant: item.ant || [], rel: item.rel || []

let touchStartX = 0;

function startFlashcard() {
  if (!currentBundleId || !bundles[currentBundleId]) return;
  const words = bundles[currentBundleId].words;
  if (words.length === 0) { toast('Bộ này không có từ nào!', 'error'); return; }

      flashWords = words.slice();

document.getElementById('wordGrid').style.display = 'none';

function renderFlashcard() {

      '<div class="flash-pinyin">' + esc(w.p || '') + '</div>' +
      (w.pos && POS_LABELS[w.pos] ? '<div class="pos-badge ' + w.pos + '">' + POS_LABELS[w.pos] + '</div>' : '') +
      '<div class="flash-meaning">' + esc(w.m || '') + '</div>';

      '<div style="margin-top:3px;">' + esc(w.ex[0].m || '') + '</div>' +

  }
  back += '</div>';

  container.innerHTML =
    '<div class="flash-card ' + (flashFlipped ? 'flipped' : '') + '" id="flashCard" onclick="flipFlashcard()">' +
      (flashFlipped ? back : front) +

      '<button class="flash-btn-review" onclick="flashSwipe(\'review\')">↻ Cần ôn</button>' +

    '</div>';

  attachSwipe();
}

function flipFlashcard() {
  flashFlipped = !flashFlipped;
  renderFlashcard();
}

function flashSwipe(action) {
  const w = flashWords[flashIndex];
  if (!w) return;

  if (action === 'learned') {
    myStatuses[w.h] = 'learned';
    flashStats.learned++;
  } else if (action === 'review') {
    myStatuses[w.h] = 'review';
    flashStats.review++;
  }
  saveMyProgress();

  flashIndex++;
  flashFlipped = false;
  renderFlashcard();
}

function attachSwipe() {
  const card = document.getElementById('flashCard');
  if (!card) return;
  card.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  card.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    const diff = touchEndX - touchStartX;
    if (Math.abs(diff) > 60) {
      if (diff > 0) flashSwipe('review');
      else flashSwipe('learned');
    }
  }, { passive: true });
}

// ===== SO KHỚP ĐÁP ÁN TYPING =====

// Bỏ dấu tiếng Việt để so sánh dễ hơn
function removeVietnameseTones(str) {
  str = str.toLowerCase().trim();
  str = str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  str = str.replace(/đ/g, 'd').replace(/Đ/g, 'D');
  return str;
}

// Tách nghĩa thành nhiều đáp án (dựa vào dấu phẩy, chấm phẩy, slash)
function splitMeanings(meaning) {
  if (!meaning) return [];
  return meaning.split(/[,;\/]+/).map(s => s.trim()).filter(s => s);
}

// Kiểm tra 2 nghĩa có khớp không (so khớp mềm)
function meaningsMatch(userAnswer, correctMeaning) {
  if (!userAnswer || !correctMeaning) return false;
  const ua = removeVietnameseTones(userAnswer);
  if (!ua) return false;
  const accepted = splitMeanings(correctMeaning);
  // Nếu user nhập giống hệt hoặc chứa 1 trong các đáp án
  for (const acc of accepted) {
    const a = removeVietnameseTones(acc);
    if (!a) continue;
    // Khớp chính xác
    if (ua === a) return true;
    // User nhập dài hơn nhưng có chứa đáp án (VD: "tôi tớ" chứa "tôi")
    if (ua.length >= 2 && a.length >= 2 && (ua.includes(a) || a.includes(ua))) {
      // Tránh khớp nhầm với chuỗi quá ngắn
      if (a.length >= 2 && ua.length >= 2) return true;
    }
  }
  return false;
}

// Kiểm tra 2 chữ Hán có khớp không (bỏ khoảng trắng)
function hanziMatch(userAnswer, correctHanzi) {
  if (!userAnswer || !correctHanzi) return false;
  const ua = userAnswer.trim().replace(/\s+/g, '');
  const ch = correctHanzi.trim().replace(/\s+/g, '');
  return ua === ch;
}

// Submit đáp án typing
function submitTypingAnswer() {
  if (quizAnswered) return;
  const inp = document.getElementById('quizTypingInput');
  if (!inp) return;
  const ans = inp.value.trim();
  if (!ans) { toast('Nhập đáp án!', 'error'); inp.focus(); return; }
  quizAnswered = true;

  const q = quizQuestions[quizIndex];
  const isH2MType = quizMode === 'hanzi2meaning_typing';
  let isCorrect = false;
  if (isH2MType) {
    isCorrect = meaningsMatch(ans, q.correct.m);
  } else {
    isCorrect = hanziMatch(ans, q.correct.h);
  }

  // Hiển thị feedback
  const fb = document.getElementById('quizFeedback');
  const inpEl = document.getElementById('quizTypingInput');
  if (inpEl) inpEl.disabled = true;

  if (isCorrect) {
    quizScore++;
    if (fb) {
      fb.style.color = '#16a34a';
      fb.innerHTML = '✅ Chính xác!';
    }
    if (inpEl) inpEl.style.borderColor = '#22c55e';
    if (inpEl) inpEl.style.background = '#dcfce7';
  } else {
    if (fb) {
      fb.style.color = '#dc2626';
      fb.innerHTML = '❌ Sai!<br><span style="font-weight:600;font-size:14px;color:#555;margin-top:6px;display:inline-block;">' +
        'Đáp án đúng: <b style="color:#16a34a;">' +
        (isH2MType ? esc(q.correct.m) : '<span style="font-family:\'Microsoft YaHei\',sans-serif;">' + esc(q.correct.h) + '</span>') +
        '</b>' +
        (isH2MType && q.correct.p ? '<br><span style="font-size:12px;color:#888;">Pinyin: ' + esc(q.correct.p) + '</span>' : '') +
        '</span>';
    }
    if (inpEl) inpEl.style.borderColor = '#ef4444';
    if (inpEl) inpEl.style.background = '#fee2e2';
  }

  setTimeout(() => { quizIndex++; renderQuiz(); }, 1400);
}
function answerQuiz(idx) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = quizQuestions[quizIndex];
  const buttons = document.querySelectorAll('#quizContent .quiz-option');
  const correctIdx = q.options.findIndex(o => o.h === q.correct.h);
  buttons.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === correctIdx) btn.classList.add('correct');
    if (i === idx && i !== correctIdx) btn.classList.add('wrong');
  });
  if (idx === correctIdx) quizScore++;
  setTimeout(() => { quizIndex++; renderQuiz(); }, 900);
}
function renderQuizResult() {
  if (!myQuizzed[currentBundleId]) myQuizzed[currentBundleId] = {};
  quizWordsThisRound.forEach(h => { myQuizzed[currentBundleId][h] = true; });
  saveMyProgress();
  const percent = Math.round((quizScore / quizTotal) * 100);
  let msg = '', emoji = '';
  if (percent === 100) { msg = 'Xuất sắc!'; emoji = '🏆'; }
  else if (percent >= 80) { msg = 'Rất tốt!'; emoji = '🎉'; }
  else if (percent >= 60) { msg = 'Khá ổn!'; emoji = '👍'; }
  else if (percent >= 40) { msg = 'Cố gắng thêm!'; emoji = '💪'; }
  else { msg = 'Ôn lại nhé!'; emoji = '📚'; }
  let html = '<div class="modal-top"><div class="header-title">🎯 Kết quả</div>' +
    '<button class="x-btn" onclick="closeQuiz()">✕</button></div>' +
    '<div class="quiz-result"><div style="font-size:50px;">' + emoji + '</div>' +
    '<div class="score">' + quizScore + '/' + quizTotal + '</div>' +
    '<div class="msg">' + msg + '</div>' +
    '<div style="color:#888;font-size:14px;">Đúng ' + percent + '%</div></div>' +
    '<div class="section-title">✅ Đánh dấu các từ vừa quiz</div>' +
    '<div class="quiz-summary-grid">';
  quizWordsThisRound.forEach(h => {
    const w = bundles[currentBundleId].words.find(x => x.h === h);
    if (!w) return;
    const cur = myStatuses[h] || 'new';
    html += '<div class="quiz-summary-card status-' + cur + '">' +
      '<div class="qsh">' + esc(h) + '</div>' +
      '<div class="qsp">' + esc(w.p || '') + '</div>' +
      '<div class="qsm">' + esc(w.m || '') + '</div>' +
      '<div class="qss-actions">' +
      '<button class="qss-btn ' + (cur === 'learned' ? 'active' : '') + ' learned" onclick="setQuizSummaryStatus(\'' + escAttr(h) + '\', \'learned\')">✓</button>' +
      '<button class="qss-btn ' + (cur === 'review' ? 'active' : '') + ' review" onclick="setQuizSummaryStatus(\'' + escAttr(h) + '\', \'review\')">↻</button>' +
      '<button class="qss-btn ' + (cur === 'hard' ? 'active' : '') + ' hard" onclick="setQuizSummaryStatus(\'' + escAttr(h) + '\', \'hard\')">!</button>' +
      '</div></div>';
  });
  html += '</div>';
  html += '<div class="form-actions" style="margin-top:16px;"><button class="btn btn-ghost" onclick="closeQuiz()">Đóng</button>' +
    '<button class="btn btn-primary" onclick="startQuiz()">🎯 Quiz tiếp</button></div>';
  document.getElementById('quizContent').innerHTML = html;
}

  const cur = myStatuses[hanzi] || 'new';

function doBulkImport() {
  const raw = document.getElementById('bulkInput').value.trim();
  if (!raw) { toast('Chưa có dữ liệu!', 'error'); return; }
  const lines = raw.split('\n').filter(l => l.trim());
  const existing = new Set(bundles[editingBundleId].words.map(w => w.h));
  let added = 0, skipped = 0;
  const updates = {};
  lines.forEach(line => {
    const parts = line.split(/\s*\|\s*|\t/).map(s => s.trim());
    if (!parts[0]) return;
    if (existing.has(parts[0])) { skipped++; return; }
    updates['bundles/' + editingBundleId + '/words/' + genId()] = {
      h: parts[0], p: parts[1] || '', pos: parts[2] || 'n', m: parts[3] || '',
      ex: parseSubItems(parts[4]), syn: parseSubItems(parts[5]),
      ant: parseSubItems(parts[6]), rel: parseSubItems(parts[7])
    };
    existing.add(parts[0]);
    added++;
  });
  if (Object.keys(updates).length === 0) { toast('Không có từ mới!', 'error'); return; }
  const isMine = bundles[editingBundleId] && bundles[editingBundleId].ownerId === currentUser.uid;
  dbRef().update(updates).then(() => {
    let msg = 'Đã nhập ' + added + ' từ';
    if (skipped > 0) msg += ' — bỏ qua ' + skipped;
    toast(msg, 'success');
    loadBundles(() => {
      closeForm();
      if (isMine) {
        openManageMyWords(editingBundleId);
        if (currentBundleId === editingBundleId) renderWords();
      } else {
        openManageWords(editingBundleId);
      }
    });
  }).catch(err => toast('Lỗi: ' + err.message, 'error'));
}

          '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
          '<button class="btn btn-purple btn-sm" onclick="openAssignBundles(\'' + uid + '\',\'' + escAttr(u.displayName || '') + '\')">📦 Gán</button>' +
          '<button class="btn btn-primary btn-sm" onclick="openViewStudentProgress(\'' + uid + '\',\'' + escAttr(u.displayName || '') + '\')">📊 Tiến độ</button>' +
          '</div></div>';
      });
    }
    document.getElementById('dashUsers').innerHTML = html;
  });
}
function openAssignBundles(uid, name) {
  dbRef('users/' + uid + '/assignedBundles').once('value').then(snapshot => {
    const assigned = snapshot.val() || {};
    const ids = Object.keys(bundles);
    let html = '<div class="modal-top"><div class="header-title">📦 Gán cho: ' + esc(name) + '</div>' +
      '<button class="x-btn" onclick="closeForm()">✕</button></div>';
    if (ids.length === 0) {
      html += '<div class="empty-msg">Chưa có bộ.</div>';
    } else {
      ids.forEach(bid => {
        const b = bundles[bid];
        const checked = assigned[bid] ? 'checked' : '';
        html += '<label style="display:flex;gap:10px;padding:10px;background:#f7f8ff;border-radius:10px;margin-bottom:8px;cursor:pointer;align-items:center;">' +
          '<input type="checkbox" class="assign-cb" data-bid="' + bid + '" ' + checked + '>' +
          '<div style="flex:1;"><div style="font-weight:700;">' + esc(b.name) + '</div>' +
          '<div style="font-size:11px;color:#888;">' + b.words.length + ' từ</div></div></label>';
      });
    }
    html += '<div class="form-actions"><button class="btn btn-ghost" onclick="closeForm()">Hủy</button>' +
  '<button class="btn btn-success" onclick="doAssignBundles(\'' + uid + '\')">💾 Lưu</button></div>';
document.getElementById('formContent').innerHTML = html;
    document.getElementById('formModal').classList.add('active');
  });
}
function doAssignBundles(uid) {
  const cbs = document.querySelectorAll('.assign-cb');
  const newAssigned = {};
  cbs.forEach(cb => { if (cb.checked) newAssigned[cb.dataset.bid] = true; });
  dbRef('users/' + uid + '/assignedBundles').set(newAssigned).then(() => {
    toast('Đã cập nhật!', 'success');
    closeForm();
    renderUsersPanel();
  });
}
function openViewStudentProgress(uid, name) {
  dbRef('users/' + uid + '/progress').once('value').then(snapshot => {
    const p = snapshot.val() || {};
    const statuses = p.statuses || {};
    const notes = p.notes || {};
    const quizzed = p.quizzed || {};
    const learned = Object.values(statuses).filter(s => s === 'learned').length;
    const review = Object.values(statuses).filter(s => s === 'review').length;
    const hard = Object.values(statuses).filter(s => s === 'hard').length;
    const noteCount = Object.keys(notes).length;
    let quizzedCount = 0;
    Object.keys(quizzed).forEach(bid => { quizzedCount += Object.keys(quizzed[bid]).length; });
    let html = '<div class="modal-top"><div class="header-title">📊 ' + esc(name) + '</div>' +
      '<button class="x-btn" onclick="closeForm()">✕</button></div>' +
      '<div class="dash-stats">' +
        '<div class="stat-card" style="background:linear-gradient(135deg,#d1fae5,#a7f3d0);"><div class="num" style="color:#16a34a;">' + learned + '</div><div class="lbl">Đã học</div></div>' +
        '<div class="stat-card" style="background:linear-gradient(135deg,#fef3c7,#fde68a);"><div class="num" style="color:#92400e;">' + review + '</div><div class="lbl">Cần ôn</div></div>' +
        '<div class="stat-card" style="background:linear-gradient(135deg,#fee2e2,#fecaca);"><div class="num" style="color:#dc2626;">' + hard + '</div><div class="lbl">Từ khó</div></div>' +
        '<div class="stat-card" style="background:linear-gradient(135deg,#dbeafe,#bfdbfe);"><div class="num" style="color:#1e40af;">' + quizzedCount + '</div><div class="lbl">Đã quiz</div></div>' +
        '<div class="stat-card" style="background:linear-gradient(135deg,#fce7f3,#fbcfe8);"><div class="num" style="color:#be185d;">' + noteCount + '</div><div class="lbl">Ghi chú</div></div>' +
      '</div>';
    const hardWords = Object.keys(statuses).filter(h => statuses[h] === 'hard');
    if (hardWords.length > 0) {
      html += '<div class="section-title">🔴 Từ khó</div><div style="display:flex;gap:6px;flex-wrap:wrap;">';
      hardWords.forEach(h => {
        html += '<span style="background:#fee2e2;color:#dc2626;padding:4px 10px;border-radius:12px;font-size:13px;font-weight:600;font-family:\'Microsoft YaHei\',sans-serif;">' + esc(h) + '</span>';
      });
      html += '</div>';
    }
    if (noteCount > 0) {
      html += '<div class="section-title">📝 Ghi chú</div>';
      Object.keys(notes).forEach(h => {
        html += '<div style="background:#f7f8ff;border-radius:8px;padding:10px;margin-bottom:6px;">' +
          '<div style="font-weight:700;font-family:\'Microsoft YaHei\',sans-serif;">' + esc(h) + '</div>' +
          '<div style="font-size:12px;color:#555;margin-top:4px;">' + esc(notes[h]) + '</div></div>';
      });
    }
    html += '<div class="form-actions"><button class="btn btn-ghost" onclick="closeForm()">Đóng</button></div>';
    document.getElementById('formContent').innerHTML = html;
    document.getElementById('formModal').classList.add('active');
  });
}
function renderPendingBadge() {
  dbRef('pendingUsers').once('value').then(snapshot => {
    const pending = snapshot.val() || {};
    const count = Object.keys(pending).length;
    const badge = document.getElementById('pendingCount');
    if (count > 0) { badge.textContent = count; badge.style.display = 'inline-block'; }
    else { badge.style.display = 'none'; }
  });
}
function renderPendingPanel() {
  dbRef('pendingUsers').once('value').then(snapshot => {
    const pending = snapshot.val() || {};
    const ids = Object.keys(pending).sort((a, b) => pending[b].requestedAt - pending[a].requestedAt);
    let html = '<h3>⏳ Chờ duyệt (' + ids.length + ')</h3>';
    if (ids.length === 0) {
      html += '<div class="empty-msg"><div class="big">✅</div>Không có tài khoản chờ duyệt.</div>';
    } else {
      ids.forEach(uid => {
        const u = pending[uid];
        html += '<div class="user-row">' +
          '<div class="uinfo"><div class="uname">' + esc(u.displayName || 'Không tên') +
          '<span class="ustatus pending">Chờ duyệt</span></div>' +
          '<div class="uemail">📧 ' + esc(u.email) + '</div></div>' +
          '<div style="display:flex;gap:6px;">' +
          '<button class="btn btn-success btn-sm" onclick="approveUser(\'' + uid + '\')">✅ Duyệt</button>' +
          '<button class="btn btn-danger btn-sm" onclick="rejectUser(\'' + uid + '\')">❌ Từ chối</button>' +
          '</div></div>';
      });
    }
    document.getElementById('dashPending').innerHTML = html;
  });
}
function renderFeedbackBadge() {
  dbRef('feedbacks').once('value').then(snapshot => {
    const fb = snapshot.val() || {};
    const unread = Object.values(fb).filter(f => !f.read).length;
    const badge = document.getElementById('feedbackCount');
    if (unread > 0) { badge.textContent = unread; badge.style.display = 'inline-block'; }
    else { badge.style.display = 'none'; }
  });
}

function renderFeedbackPanel() {
  dbRef('feedbacks').once('value').then(snapshot => {
    const fb = snapshot.val() || {};
    const ids = Object.keys(fb).sort((a, b) => fb[b].createdAt - fb[a].createdAt);
    let html = '<h3>💬 Góp ý từ học sinh (' + ids.length + ')</h3>';
    if (ids.length === 0) {
      html += '<div class="empty-msg"><div class="big">📭</div>Chưa có góp ý nào.</div>';
    } else {
      ids.forEach(fid => {
        const f = fb[fid];
        const d = new Date(f.createdAt);
        const timeStr = d.toLocaleString('vi-VN');
        html += '<div class="user-row" style="' + (!f.read ? 'border-left:4px solid #7c3aed;' : '') + '">' +
          '<div class="uinfo"><div class="uname">' + esc(f.name || 'Học sinh') +
          (!f.read ? '<span class="ustatus pending">Mới</span>' : '') + '</div>' +
          '<div class="uemail">📧 ' + esc(f.email) + ' • 🕐 ' + timeStr + '</div>' +
          '<div style="margin-top:8px;padding:10px;background:#f7f8ff;border-radius:8px;font-size:13px;color:#333;white-space:pre-wrap;">' + esc(f.content) + '</div></div>' +
          '<div style="display:flex;gap:6px;flex-direction:column;">' +
          (!f.read ? '<button class="btn btn-success btn-sm" onclick="markFeedbackRead(\'' + fid + '\')">✅ Đã đọc</button>' : '') +
          '<button class="btn btn-danger btn-sm" onclick="deleteFeedback(\'' + fid + '\')">🗑️ Xóa</button>' +
          '</div></div>';
      });
    }
    document.getElementById('dashFeedback').innerHTML = html;
  });
}

function markFeedbackRead(fid) {
  dbRef('feedbacks/' + fid + '/read').set(true).then(() => {
    renderFeedbackPanel();
    renderFeedbackBadge();
  });
}

function deleteFeedback(fid) {
  if (!confirm('Xóa góp ý này?')) return;
  dbRef('feedbacks/' + fid).remove().then(() => {
    toast('Đã xóa!', 'success');
    renderFeedbackPanel();
    renderFeedbackBadge();
  });
}
function approveUser(uid) {
  dbRef('users/' + uid + '/status').set('approved').then(() => {
    dbRef('pendingUsers/' + uid).remove();
    toast('Đã duyệt!', 'success');
    renderPendingPanel();
    renderPendingBadge();
  });
}
function rejectUser(uid) {
  if (!confirm('Từ chối và xóa tài khoản này?')) return;
  dbRef('users/' + uid).remove();
  dbRef('pendingUsers/' + uid).remove();
  toast('Đã từ chối!', 'success');
  renderPendingPanel();
  renderPendingBadge();
}
function closeForm() { document.getElementById('formModal').classList.remove('active'); }
function formBackdropClick(e) { if (e.target === e.currentTarget) closeForm(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    closeForm();
    closeQuiz();
    closeQuizSetup();
  }
});
console.log('%c🎓 Web HSK đã khởi động', 'color: #7c3aed; font-size: 16px; font-weight: bold;');
console.log('Project:', firebaseConfig.projectId);
